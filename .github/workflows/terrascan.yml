name: Terrascan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: ['synchronize', 'assigned', 'opened', 'reopened']

jobs:
  terrascan:
    runs-on: ubuntu-latest
    name: Terrascan
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.3.0
      - name: Run Terrascan Script
        run: |
          ./scripts/terrascan.sh ./terraform
          set +x
          high=$(jq '[.[].results.scan_summary.high] | add' < terrascan_report.json)
          if [[ $high -gt 0 ]];
          then
              echo "ERROR: One or more High finding"
              cat terrascan_report.json | jq ".[] | select(.results.scan_summary.high > 0)"
              exit 1
          else
              exit 0
          fi
